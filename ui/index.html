<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GabTwin · 语音对话</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-state="idle">
    <div class="app">
      <header class="bar">
        <div class="brand">
          <span class="mark"></span>
          <span class="name">GabTwin</span>
          <span class="tag">语音对话</span>
        </div>
        <div class="status" data-state="idle">
          <span class="pulse"></span>
          <span id="statusText">待机</span>
        </div>
      </header>

      <main class="stage" id="stage">
        <section class="avatar-stage" id="avatarStage" aria-label="数字人">
          <div class="avatar-glow"></div>
          <canvas id="avatarCanvas"></canvas>
          <img id="avatarPhoto" alt="" />
          <div class="avatar-caption">
            <span class="avatar-name">园园</span>
            <span class="avatar-mood" id="avatarMood">在这里</span>
          </div>
        </section>
        <div class="transcript" id="transcript">
          <div class="hint" id="hint">按「开始聆听」，然后说话。它会在你说完后接话。</div>
          <div class="conversation" id="conversation"></div>
          <div class="live" id="live"></div>
        </div>
      </main>

      <footer class="dock">
        <div class="level"><div class="level-fill" id="level"></div></div>
        <div class="row">
          <div class="metrics">
            <div class="metric"><span class="k">首字</span><span class="v" id="first">—</span></div>
            <div class="metric"><span class="k">静音</span><span class="v" id="endpoint">—</span></div>
            <div class="metric"><span class="k">首 token</span><span class="v" id="ttft">—</span></div>
            <div class="metric"><span class="k">首音</span><span class="v" id="firstAudio">—</span></div>
            <div class="metric"><span class="k">RTF</span><span class="v" id="rtf">—</span></div>
          </div>
          <div class="controls">
            <button id="start" class="primary">开始聆听</button>
            <button id="stop" disabled>停止</button>
            <button id="sample" class="ghost">示例音频</button>
            <button id="clearMemory" class="ghost">清空记忆</button>
            <button id="photoPreview" class="ghost" hidden>照片级预览</button>
            <button id="settings" class="ghost">设置</button>
          </div>
        </div>
        <div class="foot">
          <span id="device">本地识别 · 音频不出本机</span>
          <span id="llm" class="dim">—</span>
          <span id="ttsEngine" class="dim">TTS —</span>
          <span id="ptt" class="dim">按住空格说话</span>
        </div>
      </footer>
    </div>
    <div class="modal hidden" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet">
        <div class="sheet-head">
          <h2 id="settingsTitle">数字人人设</h2>
          <button id="settingsClose" class="ghost">关闭</button>
        </div>
        <p class="sheet-hint">定义人物背景、和你的关系、说话风格。系统会自动追加“中文口语、不用 Markdown、不念动作”等规则。</p>
        <textarea id="personaInput" spellcheck="false" placeholder="例如：你是……；背景：……；关系：……；风格：……"></textarea>
        <div class="sheet-foot">
          <span id="personaStatus" class="dim"></span>
          <button id="personaReset" class="ghost">恢复默认</button>
          <button id="personaSave" class="primary">保存</button>
        </div>
      </div>
    </div>
    <script src="vendor/avatar.js"></script>
    <script src="photo-avatar.js"></script>
    <script src="main.js"></script>
  </body>
</html>
