[workspace]
resolver = "2"
members = [
    "crates/gabtwin-audio",
    "crates/gabtwin-asr",
    "crates/gabtwin-session",
    "crates/gabtwin-probe",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
clap = { version = "4.5", features = ["derive"] }
ringbuf = "0.4"
cpal = "0.18"
sherpa-onnx = "2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
